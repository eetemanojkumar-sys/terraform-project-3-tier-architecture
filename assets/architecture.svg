<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-label="AWS 3-tier DevOps architecture">
  <style>
    .title{font:700 34px Arial,sans-serif;fill:#172033}.subtitle{font:16px Arial,sans-serif;fill:#52606d}.label{font:700 18px Arial,sans-serif;fill:#172033}.small{font:15px Arial,sans-serif;fill:#334155}.box{fill:#f8fafc;stroke:#64748b;stroke-width:2;rx:16}.tier{fill:#eef2ff;stroke:#4f46e5;stroke-width:2;rx:20}.dev{fill:#ecfeff;stroke:#0891b2;stroke-width:2;rx:16}.aws{fill:#fff7ed;stroke:#ea580c;stroke-width:2;rx:20}.flow{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
  <rect width="1400" height="900" fill="#ffffff"/>
  <text x="70" y="60" class="title">Production-Oriented AWS 3-Tier Architecture + DevOps Delivery</text>
  <text x="70" y="90" class="subtitle">Terraform provisions AWS infrastructure; Jenkins validates, builds, tests and deploys the application to Kubernetes with Helm.</text>

  <rect x="70" y="140" width="230" height="610" class="dev"/>
  <text x="135" y="180" class="label">DevOps Delivery</text>
  <rect x="105" y="215" width="160" height="65" class="box"/><text x="155" y="255" class="small">GitHub</text>
  <rect x="105" y="325" width="160" height="65" class="box"/><text x="145" y="365" class="small">Jenkins CI/CD</text>
  <rect x="105" y="435" width="160" height="65" class="box"/><text x="145" y="475" class="small">Docker Build/Test</text>
  <rect x="105" y="545" width="160" height="65" class="box"/><text x="150" y="585" class="small">Helm Deploy</text>
  <rect x="105" y="655" width="160" height="65" class="box"/><text x="125" y="695" class="small">Prometheus + Grafana</text>
  <path d="M185 280 V325 M185 390 V435 M185 500 V545 M185 610 V655" class="flow"/>

  <rect x="360" y="140" width="960" height="610" class="aws"/>
  <text x="720" y="180" class="label">AWS Region: ap-south-1</text>
  <rect x="400" y="215" width="880" height="485" fill="#ffffff" stroke="#fb923c" stroke-width="2" rx="20"/>
  <text x="430" y="250" class="label">VPC 10.0.0.0/16</text>
  <rect x="445" y="290" width="230" height="130" class="tier"/>
  <text x="500" y="330" class="label">Public Tier</text><text x="475" y="365" class="small">Internet Gateway</text><text x="495" y="395" class="small">Application Load Balancer</text>
  <rect x="730" y="290" width="230" height="130" class="tier"/>
  <text x="775" y="330" class="label">Application Tier</text><text x="770" y="365" class="small">Private Subnets (2 AZs)</text><text x="775" y="395" class="small">EC2 + Auto Scaling</text>
  <rect x="1015" y="290" width="230" height="130" class="tier"/>
  <text x="1085" y="330" class="label">Database Tier</text><text x="1055" y="365" class="small">Private DB Subnets</text><text x="1080" y="395" class="small">Amazon RDS MySQL</text>
  <path d="M675 355 H730 M960 355 H1015" class="flow"/>
  <text x="770" y="480" class="label">Infrastructure as Code</text>
  <rect x="650" y="515" width="380" height="90" class="box"/><text x="770" y="550" class="small">Terraform Modules: VPC | ALB | EC2 | RDS</text><text x="760" y="580" class="small">Remote State: Amazon S3 + Lockfile</text>
  <path d="M300 470 H650" class="flow"/>
  <path d="M300 575 H650" class="flow"/>
  <path d="M300 685 H650" class="flow"/>
  <text x="70" y="825" class="subtitle">Delivery flow: GitHub → Jenkins → Terraform/Ansible validation → Docker build & test → Helm → Kubernetes → Health checks → Monitoring</text>
</svg>