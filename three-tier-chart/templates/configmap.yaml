apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "three-tier-chart.fullname" . }}-config
  labels:
    {{- include "three-tier-chart.labels" . | nindent 4 }}

data:
  APP_NAME: {{ .Values.config.appName | quote }}
  ENVIRONMENT: {{ .Values.config.environment | quote }}
  APP_PORT: {{ .Values.config.appPort | quote }}
