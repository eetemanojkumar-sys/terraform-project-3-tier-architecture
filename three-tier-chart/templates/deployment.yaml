apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "three-tier-chart.fullname" . }}
  labels:
    {{- include "three-tier-chart.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      {{- include "three-tier-chart.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "three-tier-chart.selectorLabels" . | nindent 8 }}

    spec:
      containers:
        - name: {{ .Chart.Name }}

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP

          envFrom:
            - configMapRef:
                name: {{ include "three-tier-chart.fullname" . }}-config

            - secretRef:
                name: {{ include "three-tier-chart.fullname" . }}-secret

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

          resources:
            {{- toYaml .Values.resources | nindent 12 }}
