---
- name: Install application runtime packages
  ansible.builtin.dnf:
    name:
      - python3
      - python3-pip
      - git
    state: present

- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_directory }}"
    state: directory
    owner: ec2-user
    group: ec2-user
    mode: "0755"

- name: Deploy application environment file
  ansible.builtin.template:
    src: app_config.j2
    dest: "{{ app_directory }}/.env"
    owner: ec2-user
    group: ec2-user
    mode: "0600"
  when: rds_endpoint | length > 0
