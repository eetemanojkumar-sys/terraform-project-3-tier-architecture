---
- name: Install Docker
  become: true
  ansible.builtin.dnf:
    name: docker
    state: present

- name: Enable and start Docker
  become: true
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Add ec2-user to docker group
  become: true
  ansible.builtin.user:
    name: ec2-user
    groups: docker
    append: true

- name: Create application directory
  become: true
  ansible.builtin.file:
    path: /opt/app
    state: directory
    owner: ec2-user
    group: ec2-user
    mode: "0755"

- name: Copy application source
  become: true
  ansible.builtin.copy:
    src: ../../../app/
    dest: /opt/app/
    owner: ec2-user
    group: ec2-user
    mode: "0755"

- name: Build application Docker image
  become: true
  community.docker.docker_image:
    name: three-tier-app
    tag: "1.0"
    source: build
    build:
      path: /opt/app
    state: present

- name: Stop existing application container
  become: true
  community.docker.docker_container:
    name: three-tier-app
    state: absent

- name: Run application container
  become: true
  community.docker.docker_container:
    name: three-tier-app
    image: three-tier-app:1.0
    state: started
    restart_policy: unless-stopped
    ports:
      - "8081:8080"
